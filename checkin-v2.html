<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Entrance Check-in — Team Odetayo</title>
<style>
:root {
  --green: #1D9E75;
  --green-bright: #2ee6a8;
  --red: #e74c3c;
  --orange: #f39c12;
  --bg: #0a0a0a;
  --panel: #161616;
  --card: #1f1f1f;
  --text: #ffffff;
  --muted: #8a8a8a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: -webkit-fill-available; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  justify-content: center;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #0a0a0a;
  z-index: 0;
  pointer-events: none;
}

.mobile-container {
  width: 100%;
  max-width: 420px;
  min-height: 100vh;
  background: rgba(10, 10, 10, 0.96);
  position: relative;
  box-shadow: 0 0 80px rgba(0, 0, 0, 0.7);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 1;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(var(--safe-top) + 12px) 20px 12px;
  background: #101010;
}

.header-left {
  display: flex;
  align-items: center;
}

.back-btn {
  background: none;
  border: none;
  color: #fff;
  font-size: 26px;
  cursor: pointer;
  padding: 4px 10px 4px 0;
  line-height: 1;
}

.header-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.2px;
}

.header-title span {
  color: var(--green-bright);
}

/* ── Live counter ─────────────────────────────────────────────── */
.stats-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: #0d0d0d;
  border-top: 1px solid #1e1e1e;
  border-bottom: 1px solid #1e1e1e;
}

.stat {
  text-align: center;
  flex: 1;
}

.stat .stat-value {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.1;
}

.stat .stat-label {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.6px;
  text-transform: uppercase;
  margin-top: 3px;
}

.stat.checked .stat-value { color: var(--green-bright); }
.stat.remaining .stat-value { color: var(--orange); }
.stat-sep { width: 1px; height: 30px; background: #242424; }

/* ── Main terminal area ───────────────────────────────────────── */
.terminal {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 22px 20px calc(var(--safe-bottom) + 20px);
}

/* READY state */
.ready-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.scan-status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(29, 158, 117, 0.12);
  border: 1px solid rgba(46, 230, 168, 0.35);
  color: var(--green-bright);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.4px;
  padding: 7px 16px;
  border-radius: 20px;
  margin-bottom: 18px;
}

.scan-status.waiting { border-color: rgba(255,255,255,0.18); color: var(--muted); background: rgba(255,255,255,0.04); }

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--green-bright);
  box-shadow: 0 0 10px var(--green-bright);
  animation: blink 1.4s infinite;
}

.scan-status.waiting .status-dot { background: #555; box-shadow: none; animation: none; }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.scan-radar {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  background: radial-gradient(circle at center, rgba(46,230,168,0.14), transparent 70%);
  border: 2px solid rgba(46,230,168,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  margin-bottom: 22px;
  animation: radarPulse 2.2s infinite;
}

@keyframes radarPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(46,230,168,0.25); }
  50% { box-shadow: 0 0 0 18px rgba(46,230,168,0); }
}

.ready-headline {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 6px;
}

.ready-sub {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 34px;
}

.scan-btn {
  width: 100%;
  padding: 26px;
  border-radius: 20px;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  color: #fff;
  background: linear-gradient(135deg, #1D9E75, #2ee6a8);
  box-shadow: 0 10px 34px rgba(46, 230, 168, 0.35);
  transition: transform 0.15s, box-shadow 0.15s;
}

.scan-btn:active { transform: scale(0.98); }
.scan-btn:disabled { opacity: 0.6; box-shadow: none; }

.secondary-actions {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-top: 20px;
}

.secondary-link {
  background: none;
  border: none;
  color: #777;
  font-size: 13px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.secondary-link:active { color: #fff; }

/* CHECKING state */
.checking-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.spinner {
  width: 60px;
  height: 60px;
  border: 5px solid rgba(255,255,255,0.12);
  border-radius: 50%;
  border-top-color: var(--green-bright);
  animation: spin 0.9s linear infinite;
  margin-bottom: 24px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.checking-text {
  font-size: 20px;
  font-weight: 700;
}

/* ── Result states (HUGE) ─────────────────────────────────────── */
.result-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: 24px;
  padding: 32px 24px;
  animation: pop 0.3s ease;
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

.result-view.granted {
  background: linear-gradient(160deg, rgba(29,158,117,0.25), rgba(29,158,117,0.05));
  border: 2px solid rgba(46,230,168,0.55);
}

.result-view.denied {
  background: linear-gradient(160deg, rgba(231,76,60,0.25), rgba(231,76,60,0.05));
  border: 2px solid rgba(231,76,60,0.55);
}

.result-view.already {
  background: linear-gradient(160deg, rgba(243,156,18,0.22), rgba(243,156,18,0.05));
  border: 2px solid rgba(243,156,18,0.55);
}

.result-icon {
  font-size: 74px;
  line-height: 1;
  margin-bottom: 12px;
}

.result-title {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.result-view.granted .result-title { color: var(--green-bright); }
.result-view.denied .result-title { color: var(--red); }
.result-view.already .result-title { color: var(--orange); }

.result-name {
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1.1;
  word-break: break-word;
  margin-bottom: 8px;
}

.result-badge {
  display: inline-block;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.22);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 14px;
}

.result-note {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 26px;
  line-height: 1.5;
}

.result-note strong { color: #bbb; }

.continue-btn {
  width: 100%;
  padding: 20px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  color: #0a0a0a;
  background: #fff;
  transition: transform 0.15s;
}

.continue-btn.secondary {
  background: #2a2a2a;
  color: #fff;
}

.continue-btn:active { transform: scale(0.98); }

/* CODE manual input */
.code-view { width: 100%; }

.code-input-box {
  width: 100%;
  padding: 20px;
  background: #1d1d1d;
  border: 1px solid #2e2e2e;
  border-radius: 16px;
  color: #fff;
  font-size: 40px;
  font-family: monospace;
  text-align: center;
  letter-spacing: 14px;
  outline: none;
  margin-bottom: 16px;
}

.code-input-box:focus { border-color: var(--green); }

.done-input {
  width: 100%;
  padding: 18px;
  border-radius: 14px;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  border: none;
  color: #0a0a0a;
  background: linear-gradient(135deg, #1D9E75, #2ee6a8);
}

/* QR view */
.qr-box {
  border: 2px dashed rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 28px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 14px;
  background: #121212;
}

.qr-video {
  width: 100%;
  border-radius: 14px;
  margin-bottom: 14px;
  display: block;
}

@media screen and (max-width: 375px) {
  .result-name { font-size: 30px; }
  .result-title { font-size: 26px; }
  .terminal { padding: 18px 16px; }
}
</style>
</head>
<body>

<div class="mobile-container">
  <header class="header">
    <div class="header-left">
      <button class="back-btn" onclick="history.back()">←</button>
      <h1 class="header-title">ENTRANCE <span>CHECK-IN</span></h1>
    </div>
  </header>

  <div class="stats-bar" id="statsBar">
    <div class="stat checked">
      <div class="stat-value" id="statChecked">–</div>
      <div class="stat-label">Checked in</div>
    </div>
    <div class="stat-sep"></div>
    <div class="stat remaining">
      <div class="stat-value" id="statRemaining">–</div>
      <div class="stat-label">Remaining</div>
    </div>
  </div>

  <div class="terminal" id="terminal">
    <!-- state injected by JS -->
  </div>
</div>

<script>
let nfcReading = false;
let qrStream = null;
let qrDetector = null;
let qrTicking = false;

const terminal = document.getElementById('terminal');

function h(html) { terminal.innerHTML = html; }

/* ── Stats ─────────────────────────────────────────────────────── */
async function loadStats() {
  try {
    const res = await fetch('/api/admin/stats');
    const data = await res.json();
    const checked = data.checked_in || 0;
    const registered = data.registered || 0;
    document.getElementById('statChecked').textContent = checked;
    document.getElementById('statRemaining').textContent = Math.max(0, registered - checked);
  } catch {}
}
setInterval(loadStats, 15000);

/* ── Ready (default) ───────────────────────────────────────────── */
function renderReady() {
  stopQr();
  h(`
    <div class="ready-view">
      <div class="scan-status" id="statusPill">
        <span class="status-dot"></span>
        <span id="statusText">Scanner Ready</span>
      </div>
      <div class="scan-radar">📡</div>
      <div class="ready-headline">READY TO SCAN</div>
      <div class="ready-sub">Hold guest card or QR code near the phone</div>
      <button class="scan-btn" id="scanGuest" onclick="startScan()">Scan Guest</button>
      <div class="secondary-actions">
        <button class="secondary-link" onclick="renderCode()">Enter code manually</button>
      </div>
    </div>
  `);
}

function setStatus(text, waiting) {
  const pill = document.getElementById('statusPill');
  const label = document.getElementById('statusText');
  if (!pill || !label) return;
  pill.classList.toggle('waiting', !!waiting);
  label.textContent = text;
}

/* ── Scanning ──────────────────────────────────────────────────── */
async function startScan() {
  const btn = document.getElementById('scanGuest');
  const supportsNfc = 'NDEFReader' in window;
  const supportsQr = 'BarcodeDetector' in window;

  if (!supportsNfc && !supportsQr) {
    setStatus('NFC + camera not supported — use code', true);
    renderCode();
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Scanning…';
  setStatus('Waiting for guest…', true);

  try {
    if (supportsNfc) {
      const reader = new NDEFReader();
      await reader.scan();
      reader.onreading = (event) => {
        const uid = event.serialNumber;
        setStatus('Checking ticket…', false);
        btn.disabled = true;
        renderChecking();
        checkTicket({ token: uid });
      };
    }
  } catch (err) {
    setStatus('NFC error — trying QR camera', true);
  }

  if (supportsQr) {
    startQrCamera();
  }

  if (!supportsNfc) {
    setStatus('Scanner ready — hold QR to camera', true);
  }
}

async function startQrCamera() {
  if (qrStream) return;
  try {
    qrStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    qrDetector = new BarcodeDetector({ formats: ['qr_code'] });
    qrTicking = true;
    tickQr();
  } catch {}
}

async function tickQr() {
  if (!qrTicking || !qrStream) return;
  const video = getVideo();
  if (video && video.readyState >= 2) {
    try {
      const codes = await qrDetector.detect(video);
      if (codes.length > 0) {
        const raw = (codes[0].rawValue || '').trim();
        if (/^\d{4}$/.test(raw)) {
          setStatus('Checking ticket…', false);
          renderChecking();
          checkTicket({ code: raw });
          return;
        }
      }
    } catch {}
  }
  requestAnimationFrame(tickQr);
}

function getVideo() {
  let v = document.getElementById('qrVideo');
  if (!v && qrStream) {
    const qv = document.createElement('video');
    qv.id = 'qrVideo';
    qv.playsInline = true;
    qv.muted = true;
    qv.style.display = 'none';
    qv.srcObject = qrStream;
    qv.play().catch(() => {});
    document.body.appendChild(qv);
    return qv;
  }
  return v;
}

function stopQr() {
  qrTicking = false;
  if (qrStream) {
    qrStream.getTracks().forEach(t => t.stop());
    qrStream = null;
  }
  const v = document.getElementById('qrVideo');
  if (v) v.remove();
}

/* ── Checking ──────────────────────────────────────────────────── */
function renderChecking() {
  h(`
    <div class="checking-view">
      <div class="spinner"></div>
      <div class="checking-text">Checking ticket…</div>
    </div>
  `);
}

/* ── Check API ─────────────────────────────────────────────────── */
async function checkTicket(body) {
  stopQr();
  try {
    const res = await fetch('/api/checkin-v2', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    renderResult(data);
  } catch (err) {
    h(renderDenied('Could not reach server. Please try again.', 'Network error'));
  }
}

function renderResult(data) {
  loadStats();
  if (data.status === 'granted') {
    const name = data.guest.name;
    const plusOne = data.guest.plus_one ? (data.guest.plus_one_name || 'Plus one') : null;
    h(`
      <div class="result-view granted">
        <div class="result-icon">✅</div>
        <div class="result-title">Access Granted</div>
        <div class="result-name">${esc(name)}</div>
        ${plusOne ? `<div class="result-badge">+ ${esc(plusOne)}</div>` : '<div class="result-badge">Ticket verified</div>'}
        <p class="result-note">Ticket verified successfully<br/><strong>Green = ENTER</strong></p>
        <button class="continue-btn" onclick="renderReady()">Continue Scanning</button>
      </div>
    `);
  } else if (data.status === 'already_used') {
    const time = data.guest.checked_in_at ? new Date(data.guest.checked_in_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    h(`
      <div class="result-view already">
        <div class="result-icon">⚠️</div>
        <div class="result-title">Already Checked In</div>
        <div class="result-name">${esc(data.guest.name)}</div>
        <div class="result-badge">Already used this ticket</div>
        <p class="result-note">Checked in at <strong>${esc(time)}</strong></p>
        <button class="continue-btn" onclick="renderReady()">Continue</button>
      </div>
    `);
  } else {
    h(renderDenied('Ticket not found', 'This ticket could not be verified.'));
  }
}

function renderDenied(title, note) {
  return `
    <div class="result-view denied">
      <div class="result-icon">🚫</div>
      <div class="result-title">Access Denied</div>
      <div class="result-name">—</div>
      <div class="result-badge">${esc(title)}</div>
      <p class="result-note">${esc(note)}</p>
      <button class="continue-btn" onclick="renderReady()">Try Again</button>
    </div>
  `;
}

/* ── Manual code entry ─────────────────────────────────────────── */
function renderCode() {
  stopQr();
  h(`
    <div class="code-view">
      <div class="scan-status waiting">
        <span class="status-dot"></span>
        <span>Manual entry</span>
      </div>
      <input type="text" class="code-input-box" id="codeInput" placeholder="0000" inputmode="numeric" pattern="[0-9]*" maxlength="4" autofocus />
      <button class="done-input" onclick="submitCode()">Check In</button>
    </div>
  `);
  document.getElementById('codeInput').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 4);
  });
  document.getElementById('codeInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') submitCode();
  });
}

function submitCode() {
  const code = document.getElementById('codeInput').value.trim();
  if (!/^\d{4}$/.test(code)) return;
  setStatus('');
  renderChecking();
  checkTicket({ code });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

renderReady();
loadStats();
</script>
</body>
</html>
